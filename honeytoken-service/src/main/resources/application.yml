server:
  port: 8084

spring:
  application:
    name: honeytoken-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.honeytoken: DEBUG

